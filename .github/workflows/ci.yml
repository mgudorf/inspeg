name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history, not just the tip commit
      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only needed if this repo moves to an org account.

  hooks:
    # Runs the same pre-commit hooks contributors have installed locally, so a
    # broken or bypassed (--no-verify) hook config fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest

  surfaces:
    # The Chrome and VS Code extensions are plain JS with no build step; CI
    # cannot click a real context menu (the surface-smoke skill covers that
    # manually), but it CAN catch syntax rot and manifest breakage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check extension scripts
        run: |
          for f in extension/*.js extension/anchoring/*.js vscode-ext/extension.js ui/*.js ui/hud/*.js; do
            node --check "$f"
          done
      - name: Validate manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json'))"
          node -e "JSON.parse(require('fs').readFileSync('vscode-ext/package.json'))"
      - name: Package VS Code extension (smoke)
        run: |
          npm install -g @vscode/vsce
          cd vscode-ext && vsce package --allow-missing-repository -o /tmp/inspeg.vsix
