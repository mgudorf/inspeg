# Setup: pip install -e ".[dev]" && pre-commit install
# The gitleaks hook blocks any commit that stages something resembling a
# credential: API keys, OAuth/access tokens, private keys, cloud secrets.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict

  # Mirror what CI enforces so failures surface before push.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
      - id: ruff-format

  # Mechanical enforcement of the two checkable hard invariants:
  # migrations are never edited; projection tables are written only via
  # Store.record (see scripts/check_invariants.py).
  - repo: local
    hooks:
      - id: inspeg-invariants
        name: inspeg architectural invariants
        entry: python scripts/check_invariants.py
        language: system
        files: ^(schema/.*\.sql|src/.*\.py|tests/.*\.py)$
