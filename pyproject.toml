[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inspeg"
version = "0.1.0"
description = "Manual, multimodal capture into a provenance-anchored knowledge graph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Matthew Gudorf", email = "matthew.gudorf@gmail.com" }]
keywords = ["knowledge-graph", "provenance", "annotation", "capture", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "beautifulsoup4>=4.12",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
    "pre-commit>=3.5",
]
# pywebview is BSD-3-Clause; its Windows backend deps (pythonnet, clr-loader)
# are MIT. Verify at pin time (ADR 0009).
hud = [
    "pywebview>=6; sys_platform == 'win32'",
]

[project.scripts]
inspeg = "inspeg.__main__:main"
inspeg-hud = "inspeg.hud:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inspeg"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "inspeg/schema"
"ui" = "inspeg/ui"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
